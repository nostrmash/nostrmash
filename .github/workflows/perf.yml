name: Performance Snapshot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      bench_count:
        description: "go test benchmark count per suite"
        required: false
        default: "5"
      enforcement_mode:
        description: "advisory or release_candidate"
        required: false
        default: "advisory"
      baseline_run_id:
        description: "Optional prior workflow run ID to compare against"
        required: false
        default: ""
      baseline_artifact_name:
        description: "Artifact name from baseline run (e.g. perf-snapshot-123)"
        required: false
        default: ""
      regression_threshold_pct:
        description: "Informational suite-shift marker percent. The fail gate is 1.75× the history median, not this percent."
        required: false
        default: "15"
      fail_on_regression:
        description: "Fail when a benchmark is slower than 1.75× its baseline (history median when history is present)"
        required: false
        default: "false"
      include_loadtest:
        description: "Run the WS+API load harness (non-gating, artifacts only)"
        required: false
        default: "false"
      recalibrate_gates:
        description: "Print advisory gate-threshold recommendations from baseline history"
        required: false
        default: "false"

# Baselines are published as Actions artifacts on every push to main. Pull
# requests download the latest artifact. The committed main-latest directories
# are the seed used when that artifact does not exist yet. Nothing in this
# workflow pushes to main.
env:
  PROTECTED_BASELINE_DIR: benchmarks/history/protection/main-latest
  # Informational suite-shift marker only. The fail gate is the history factor
  # below, not this percent.
  PROTECTED_THRESHOLD_PCT: "15"
  # A benchmark fails the pull-request gate when it is slower than this factor
  # times the median of the last PROTECTED_HISTORY_WINDOW main snapshots.
  PROTECTED_HISTORY_FACTOR: "1.75"
  PROTECTED_HISTORY_WINDOW: "40"
  # Append-only compact history (pruned to the last 90 entries), carried in
  # the baseline artifact. The committed file seeds the first artifact.
  # gate_recalibrate.sh reads the artifact copy when one exists.
  PROTECTED_HISTORY_FILE: benchmarks/history/protection/history.ndjson
  LOADTEST_HISTORY_FILE: loadtest/baseline/history.ndjson
  # Seed for the load-harness artifact. The loadtest-baseline job republishes
  # summary.json; pull requests download that artifact.
  LOADTEST_BASELINE_DIR: loadtest/baseline/main-latest
  # Seeding + harness knobs shared by the baseline and compare jobs so the two
  # runs are byte-for-byte identical in shape.
  LOADTEST_FIXTURE_SOURCE: internal/replay/testdata/relay_payloads/basic_flow.ndjson
  LOADTEST_FIXTURE_REPEAT: "300"
  LOADTEST_WS_CLIENTS: "32"
  LOADTEST_API_CLIENTS: "32"
  LOADTEST_WARMUP: "3s"
  LOADTEST_DURATION: "30s"

jobs:
  baseline:
    name: Refresh protected baseline (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true

      - name: Seed history from the previous baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./scripts/perf_fetch_baseline_artifact.sh \
            protected-baseline "${RUNNER_TEMP}/prev-protected-baseline"
          prev="${RUNNER_TEMP}/prev-protected-baseline/history.ndjson"
          if [ -s "${prev}" ]; then
            cp "${prev}" "${PROTECTED_HISTORY_FILE}"
            echo "Seeded benchmark history from the previous artifact."
          else
            echo "No previous artifact; seeding history from the committed file."
          fi

      - name: Collect protected baseline
        run: |
          rm -rf "${PROTECTED_BASELINE_DIR}"
          PERF_BENCH_COUNT=5 \
          PERF_COLLECT_SCOPE=protected \
          PERF_OUTPUT_BASE="$(dirname "${PROTECTED_BASELINE_DIR}")" \
          PERF_RUN_ID="$(basename "${PROTECTED_BASELINE_DIR}")" \
          bash ./scripts/perf_collect.sh

      - name: Append pruned benchmark history
        run: |
          HISTORY_SHA="${GITHUB_SHA}" \
          bash ./scripts/perf_history_append.sh benchmarks \
            "${PROTECTED_BASELINE_DIR}" \
            "${PROTECTED_HISTORY_FILE}"

      - name: Stage protected baseline artifact
        run: |
          stage="${RUNNER_TEMP}/protected-baseline"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp -a "${PROTECTED_BASELINE_DIR}" "${stage}/main-latest"
          cp "${PROTECTED_HISTORY_FILE}" "${stage}/history.ndjson"

      - name: Upload protected baseline
        uses: actions/upload-artifact@v7
        with:
          name: protected-baseline
          path: ${{ runner.temp }}/protected-baseline
          retention-days: 90
          if-no-files-found: error

  compare:
    name: Compare protected benchmarks (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true

      - name: Collect current protected snapshot
        run: |
          PERF_BENCH_COUNT=5 \
          PERF_COLLECT_SCOPE=protected \
          PERF_OUTPUT_BASE=benchmarks/history/ci \
          PERF_RUN_ID=current \
          bash ./scripts/perf_collect.sh

      - name: Fetch latest protected baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./scripts/perf_fetch_baseline_artifact.sh \
            protected-baseline "${RUNNER_TEMP}/protected-baseline"

      - name: Compare against main baseline
        run: |
          set -euo pipefail
          fetched="${RUNNER_TEMP}/protected-baseline"
          baseline="${PROTECTED_BASELINE_DIR}"
          history="${PROTECTED_HISTORY_FILE}"
          if [ -d "${fetched}/main-latest/benchmarks" ] && [ -s "${fetched}/history.ndjson" ]; then
            baseline="${fetched}/main-latest"
            history="${fetched}/history.ndjson"
            echo "Using the latest protected-baseline artifact."
          elif [ -d "${PROTECTED_BASELINE_DIR}/benchmarks" ]; then
            echo "No protected-baseline artifact yet; using the committed seed ${PROTECTED_BASELINE_DIR}."
          else
            echo "No protected baseline yet; running advisory only."
            exit 0
          fi
          set +e
          PROTECTED_HISTORY_FILE="${history}" \
          PROTECTED_HISTORY_FACTOR="${PROTECTED_HISTORY_FACTOR}" \
          PROTECTED_HISTORY_WINDOW="${PROTECTED_HISTORY_WINDOW}" \
          REGRESSION_THRESHOLD_PCT="${PROTECTED_THRESHOLD_PCT}" \
          ENFORCEMENT_MODE="release_candidate" \
          FAIL_ON_REGRESSION=1 \
          bash ./scripts/perf_protect_compare.sh \
            "${baseline}" \
            benchmarks/history/ci/current \
            benchmarks/compare
          status=$?
          set -e
          if [ -f benchmarks/compare/protected-summary.md ]; then
            cat benchmarks/compare/protected-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${status}"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-compare-${{ github.run_number }}
          path: benchmarks/compare/
          retention-days: 30
          if-no-files-found: ignore

  snapshot:
    name: Manual perf snapshot
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"

      - name: Collect benchmark snapshot
        run: make perf-collect
        env:
          PERF_BENCH_COUNT: ${{ inputs.bench_count }}
          PERF_COLLECT_SCOPE: protected
          PERF_OUTPUT_BASE: benchmarks/history/ci/current
          PERF_RUN_ID: current-${{ github.run_number }}-${{ github.sha }}

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v7
        with:
          name: perf-snapshot-${{ github.run_number }}
          path: benchmarks/history/ci/current/
          retention-days: 30

      - name: Download baseline artifact
        if: ${{ inputs.baseline_run_id != '' && inputs.baseline_artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.baseline_run_id }}
          name: ${{ inputs.baseline_artifact_name }}
          path: benchmarks/history/ci/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Compare protected benchmarks
        id: compare
        if: ${{ inputs.baseline_run_id != '' && inputs.baseline_artifact_name != '' }}
        env:
          REGRESSION_THRESHOLD_PCT: ${{ inputs.regression_threshold_pct }}
          ENFORCEMENT_MODE: ${{ inputs.enforcement_mode }}
          FAIL_ON_REGRESSION: 0
          # Ad-hoc runs compare the two chosen snapshots. Leave the history
          # file unset so the workflow-level seed path is not the fail gate.
          PROTECTED_HISTORY_FILE: ""
        run: |
          set -euo pipefail
          BASELINE_DIR="$(python3 - <<'PY'
          import pathlib
          base = pathlib.Path("benchmarks/history/ci/baseline")
          selected = None
          for path in sorted(base.rglob("metadata.json")):
              if path.parent.joinpath("benchmarks").is_dir():
                  selected = path.parent
                  break
          print(selected if selected else "")
          PY
          )"
          CURRENT_DIR="$(python3 - <<'PY'
          import pathlib
          base = pathlib.Path("benchmarks/history/ci/current")
          selected = None
          for path in sorted(base.rglob("metadata.json")):
              if path.parent.joinpath("benchmarks").is_dir():
                  selected = path.parent
                  break
          print(selected if selected else "")
          PY
          )"
          if [ -z "${BASELINE_DIR}" ] || [ -z "${CURRENT_DIR}" ]; then
            mkdir -p benchmarks/compare
            cat > benchmarks/compare/protected-summary.md <<'EOF'
          # Protected Benchmark Comparison

          Baseline comparison was requested but baseline/current snapshot could not be resolved.
          Run remains advisory unless explicit enforcement is configured and a valid baseline is provided.
          EOF
            cat > benchmarks/compare/protected-summary.json <<'EOF'
          {"error":"missing baseline or current snapshot"}
          EOF
            echo "comparison_ready=false" >> "${GITHUB_OUTPUT}"
            echo "regression_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Empty history file: this ad-hoc compare gates on the chosen snapshot,
          # not the workflow-level history seed.
          PROTECTED_HISTORY_FILE= \
          bash ./scripts/perf_protect_compare.sh "${BASELINE_DIR}" "${CURRENT_DIR}" benchmarks/compare

      - name: Upload comparison report
        if: ${{ inputs.baseline_run_id != '' && inputs.baseline_artifact_name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-compare-${{ github.run_number }}
          path: benchmarks/compare/
          retention-days: 30

      - name: Enforce regression threshold
        if: ${{ inputs.enforcement_mode == 'release_candidate' && inputs.fail_on_regression == 'true' && steps.compare.outputs.comparison_ready == 'true' && steps.compare.outputs.regression_count != '0' }}
        run: |
          echo "A protected benchmark is slower than ${PROTECTED_HISTORY_FACTOR}× its baseline snapshot."
          echo "See perf-compare artifact for details."
          exit 1

  loadtest:
    name: WS + API load harness (manual, non-gating)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_loadtest == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nostrmash
          POSTGRES_PASSWORD: nostrmash
          POSTGRES_DB: nostrmash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nostrmash -d nostrmash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nostrmash:nostrmash@localhost:5432/nostrmash?sslmode=disable
      HTTP_ADDR: ":8080"
      # The pgx default pool of 4 connections deadlocks under mixed WS+API
      # concurrency; size it to comfortably exceed total client count so the
      # harness measures backend latency rather than pool-acquire queueing.
      DATABASE_MAX_CONNS: "64"
      # Raise per-connection/per-client limits so the harness measures backend
      # latency rather than rate-limit rejections.
      PRIMAL_WS_MAX_REQ_PER_MINUTE: "1000000"
      HTTP_RATE_LIMIT_RPM: "1000000"
      HTTP_RATE_LIMIT_BURST: "100000"
      HTTP_DISCOVERY_RATE_LIMIT_RPM: "1000000"
      HTTP_SEARCH_RATE_LIMIT_RPM: "1000000"
      HTTP_BATCH_RATE_LIMIT_RPM: "1000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U nostrmash -d nostrmash && exit 0
            sleep 1
          done
          echo "Postgres did not become healthy in time"
          exit 1

      - name: Start API server
        run: |
          go run ./cmd/api > api-server.log 2>&1 &
          echo "API_PID=$!" >> "${GITHUB_ENV}"
          for i in {1..60}; do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          cat api-server.log || true
          exit 1

      - name: Run WS + API load harness
        continue-on-error: true
        run: |
          mkdir -p loadtest/results
          go run ./loadtest/harness \
            -base-url http://localhost:8080 \
            -ws-clients 32 -api-clients 32 \
            -warmup 3s -duration 30s \
            -out loadtest/results/ws-api-summary.json

      - name: Stop API server
        if: always()
        run: |
          if [ -n "${API_PID:-}" ]; then
            kill "${API_PID}" || true
          fi

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-ws-api-${{ github.run_number }}
          path: |
            loadtest/results/
            api-server.log
          retention-days: 30
          if-no-files-found: warn

  loadtest-baseline:
    name: Refresh load-harness baseline (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nostrmash
          POSTGRES_PASSWORD: nostrmash
          POSTGRES_DB: nostrmash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nostrmash -d nostrmash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nostrmash:nostrmash@localhost:5432/nostrmash?sslmode=disable
      HTTP_ADDR: ":8080"
      # Size the pool above total client count so the harness measures backend
      # latency rather than pool-acquire queueing (matches the manual job).
      DATABASE_MAX_CONNS: "64"
      PRIMAL_WS_MAX_REQ_PER_MINUTE: "1000000"
      HTTP_RATE_LIMIT_RPM: "1000000"
      HTTP_RATE_LIMIT_BURST: "100000"
      HTTP_DISCOVERY_RATE_LIMIT_RPM: "1000000"
      HTTP_SEARCH_RATE_LIMIT_RPM: "1000000"
      HTTP_BATCH_RATE_LIMIT_RPM: "1000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true

      - name: Wait for Postgres
        run: bash ./scripts/loadtest_ci_seed.sh wait

      - name: Seed Postgres via replay
        run: bash ./scripts/loadtest_ci_seed.sh seed

      - name: Start API server
        run: bash ./scripts/loadtest_ci_seed.sh start-api

      - name: Run WS + API load harness
        run: |
          mkdir -p "${LOADTEST_BASELINE_DIR}"
          go run ./loadtest/harness \
            -base-url http://localhost:8080 \
            -ws-clients "${LOADTEST_WS_CLIENTS}" -api-clients "${LOADTEST_API_CLIENTS}" \
            -warmup "${LOADTEST_WARMUP}" -duration "${LOADTEST_DURATION}" \
            -out "${LOADTEST_BASELINE_DIR}/summary.json"

      - name: Stop API server
        if: always()
        run: bash ./scripts/loadtest_ci_seed.sh stop-api

      - name: Seed history from the previous load-harness artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./scripts/perf_fetch_baseline_artifact.sh \
            loadtest-baseline "${RUNNER_TEMP}/prev-loadtest-baseline"
          prev="${RUNNER_TEMP}/prev-loadtest-baseline/history.ndjson"
          if [ -s "${prev}" ]; then
            cp "${prev}" "${LOADTEST_HISTORY_FILE}"
            echo "Seeded load-harness history from the previous artifact."
          else
            echo "No previous artifact; seeding history from the committed file."
          fi

      - name: Append pruned load-harness history
        run: |
          HISTORY_SHA="${GITHUB_SHA}" \
          bash ./scripts/perf_history_append.sh loadtest \
            "${LOADTEST_BASELINE_DIR}/summary.json" \
            "${LOADTEST_HISTORY_FILE}"

      - name: Stage load-harness baseline artifact
        run: |
          stage="${RUNNER_TEMP}/loadtest-baseline"
          rm -rf "${stage}"
          mkdir -p "${stage}/main-latest"
          cp "${LOADTEST_BASELINE_DIR}/summary.json" "${stage}/main-latest/summary.json"
          cp "${LOADTEST_HISTORY_FILE}" "${stage}/history.ndjson"
          if [ -f api-server.log ]; then
            cp api-server.log "${stage}/api-server.log"
          fi

      - name: Upload load-harness baseline
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-baseline
          path: ${{ runner.temp }}/loadtest-baseline
          retention-days: 90
          if-no-files-found: error

      - name: Upload load-harness log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-baseline-log-${{ github.run_number }}
          path: api-server.log
          retention-days: 14
          if-no-files-found: ignore

  loadtest-compare:
    name: Compare WS + API load harness (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nostrmash
          POSTGRES_PASSWORD: nostrmash
          POSTGRES_DB: nostrmash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nostrmash -d nostrmash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nostrmash:nostrmash@localhost:5432/nostrmash?sslmode=disable
      HTTP_ADDR: ":8080"
      DATABASE_MAX_CONNS: "64"
      PRIMAL_WS_MAX_REQ_PER_MINUTE: "1000000"
      HTTP_RATE_LIMIT_RPM: "1000000"
      HTTP_RATE_LIMIT_BURST: "100000"
      HTTP_DISCOVERY_RATE_LIMIT_RPM: "1000000"
      HTTP_SEARCH_RATE_LIMIT_RPM: "1000000"
      HTTP_BATCH_RATE_LIMIT_RPM: "1000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true

      - name: Wait for Postgres
        run: bash ./scripts/loadtest_ci_seed.sh wait

      - name: Seed Postgres via replay
        run: bash ./scripts/loadtest_ci_seed.sh seed

      - name: Start API server
        run: bash ./scripts/loadtest_ci_seed.sh start-api

      - name: Run WS + API load harness
        run: |
          mkdir -p loadtest/results
          go run ./loadtest/harness \
            -base-url http://localhost:8080 \
            -ws-clients "${LOADTEST_WS_CLIENTS}" -api-clients "${LOADTEST_API_CLIENTS}" \
            -warmup "${LOADTEST_WARMUP}" -duration "${LOADTEST_DURATION}" \
            -out loadtest/results/ws-api-summary.json

      - name: Stop API server
        if: always()
        run: bash ./scripts/loadtest_ci_seed.sh stop-api

      - name: Fetch latest load-harness baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./scripts/perf_fetch_baseline_artifact.sh \
            loadtest-baseline "${RUNNER_TEMP}/loadtest-baseline"

      - name: Compare against main baseline
        run: |
          set -euo pipefail
          baseline="${LOADTEST_BASELINE_DIR}/summary.json"
          fetched="${RUNNER_TEMP}/loadtest-baseline/main-latest/summary.json"
          if [ -f "${fetched}" ]; then
            baseline="${fetched}"
            echo "Using the latest loadtest-baseline artifact."
          elif [ ! -f "${baseline}" ]; then
            echo "No load-harness baseline yet; running advisory only."
          else
            echo "No loadtest-baseline artifact yet; using the committed seed ${baseline}."
          fi
          FAIL_ON_REGRESSION=1 \
          bash ./scripts/loadtest_compare.sh \
            "${baseline}" \
            loadtest/results/ws-api-summary.json \
            loadtest/compare >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-compare-${{ github.run_number }}
          path: |
            loadtest/compare/
            loadtest/results/
            api-server.log
          retention-days: 30
          if-no-files-found: warn

  recalibrate:
    name: Recommend gate thresholds (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recalibrate_gates == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest baseline histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./scripts/perf_fetch_baseline_artifact.sh \
            protected-baseline "${RUNNER_TEMP}/protected-baseline"
          bash ./scripts/perf_fetch_baseline_artifact.sh \
            loadtest-baseline "${RUNNER_TEMP}/loadtest-baseline"

      - name: Recommend thresholds from baseline history
        env:
          # Surface the currently-configured gates so the reducer can print a
          # "vs configured" column. Keep these in sync with the gate defaults.
          LOADTEST_ERROR_RATE_FLOOR: "0.01"
          LOADTEST_ERROR_RATE_FACTOR: "2.0"
          PROTECTED_THRESHOLD_PCT: ${{ env.PROTECTED_THRESHOLD_PCT }}
          PROTECTED_HISTORY_FACTOR: ${{ env.PROTECTED_HISTORY_FACTOR }}
          PROTECTED_HISTORY_WINDOW: ${{ env.PROTECTED_HISTORY_WINDOW }}
        run: |
          bench="${PROTECTED_HISTORY_FILE}"
          load="${LOADTEST_HISTORY_FILE}"
          if [ -s "${RUNNER_TEMP}/protected-baseline/history.ndjson" ]; then
            bench="${RUNNER_TEMP}/protected-baseline/history.ndjson"
          fi
          if [ -s "${RUNNER_TEMP}/loadtest-baseline/history.ndjson" ]; then
            load="${RUNNER_TEMP}/loadtest-baseline/history.ndjson"
          fi
          bash ./scripts/gate_recalibrate.sh \
            "${load}" \
            "${bench}" >> "${GITHUB_STEP_SUMMARY}"
